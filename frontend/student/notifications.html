<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Library LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left"><span class="topbar-title">Notifications</span></div>
      <div class="topbar-right"><button class="btn btn-outline btn-sm" onclick="markAll()">Mark All Read</button></div>
    </header>
    <main class="content">
      <div class="card"><div id="notif-list"></div></div>
    </main>
  </div>
</div>
<div class="modal-overlay" id="notif-modal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <span id="notif-modal-title">Notification</span>
      <button class="close-btn" onclick="closeModal('notif-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <div id="notif-modal-meta" style="font-size:12px;color:#64748b;margin-bottom:10px"></div>
      <div id="notif-modal-body" style="white-space:pre-wrap;line-height:1.6;color:#334155"></div>
    </div>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
  if (!requireAuth('student')) throw '';
  let notificationsData = [];
  async function load() {
    const r = await apiFetch('/notifications/');
    const el = document.getElementById('notif-list');
    if (!r?.ok || !r.data.length) { el.innerHTML='<div class="empty-state"><p>No notifications</p></div>'; return; }
    notificationsData = r.data;
    el.innerHTML = notificationsData.map(n => {
      const colors = { success:'badge-success', warning:'badge-warning', info:'badge-info' };
      return `<div class="notif-item ${n.is_read?'':'unread'}" onclick="openNotification(${n.id},this)">
        <div class="notif-title"><span class="badge ${colors[n.type]||'badge-gray'}" style="margin-right:6px">${n.type||'info'}</span>${n.title}</div>
        <div class="notif-msg">${n.message||''}</div>
        <div class="notif-time">${timeAgo(n.created_at)}</div>
      </div>`;
    }).join('');
  }
  async function openNotification(id, el) {
    const n = notificationsData.find(item => item.id === id);
    if (!n) return;
    document.getElementById('notif-modal-title').textContent = n.title || 'Notification';
    document.getElementById('notif-modal-meta').textContent = `${(n.type || 'info').toUpperCase()} • ${formatDate(n.created_at)} ${formatTime(n.created_at)}`;
    document.getElementById('notif-modal-body').textContent = n.message || 'No additional details.';
    openModal('notif-modal');
    await markRead(id, el);
  }
  async function markRead(id, el) {
    el.classList.remove('unread');
    await apiFetch(`/notifications/read/${id}`, { method:'PUT' });
    loadNotifBadge();
  }
  async function markAll() {
    await apiFetch('/notifications/read-all', { method:'PUT' });
    load(); loadNotifBadge();
  }
  load();
</script>
</body>
</html>
