<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Library LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar"><div class="topbar-left"><span class="topbar-title">My Profile</span></div></header>
    <main class="content">
      <div style="max-width:520px;display:grid;gap:20px">
        <div class="card">
          <div class="card-header">Profile Information</div>
          <div class="card-body">
            <div style="text-align:center;margin-bottom:20px">
              <div id="avatar-box" style="display:flex;justify-content:center;margin-bottom:8px"></div>
              <div style="margin-bottom:10px">
                <label class="btn btn-outline btn-sm" style="cursor:pointer">Change photo<input type="file" accept="image/*" hidden onchange="uploadPhoto(this, load)"></label>
                <button class="btn btn-ghost btn-sm" onclick="removePhoto(load)">Remove</button>
              </div>
              <div style="font-weight:700" id="p-name-display"></div>
              <div style="font-size:12px;color:#64748b" id="p-id-display"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Full Name</label><input type="text" id="f-name"></div>
              <div class="form-group"><label>Phone</label><input type="text" id="f-phone"></div>
            </div>
            <div class="form-group"><label>Email</label><input type="email" id="f-email" disabled style="background:#f8fafc"></div>
            <div class="form-group"><label>Address</label><textarea id="f-address" rows="2"></textarea></div>
            <button class="btn btn-primary" onclick="updateProfile()">Update Profile</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
  if (!requireAuth('student')) throw '';
  async function load() {
    const r = await apiFetch('/auth/profile');
    if (!r?.ok) return;
    const d = r.data;
    document.getElementById('f-name').value    = d.name||'';
    document.getElementById('f-phone').value   = d.phone||'';
    document.getElementById('f-email').value   = d.email||'';
    document.getElementById('f-address').value = d.address||'';
    document.getElementById('p-name-display').textContent = d.name||'';
    document.getElementById('p-id-display').textContent   = d.member_id||'';
    document.getElementById('avatar-box').innerHTML = avatarHtml(d.name, d.photo, 84);
  }
  async function updateProfile() {
    const r = await apiFetch('/auth/profile', { method:'PUT', body:JSON.stringify({
      name:document.getElementById('f-name').value,
      phone:document.getElementById('f-phone').value,
      address:document.getElementById('f-address').value
    })});
    if (r?.ok) { showToast('Profile updated!','success'); load(); }
    else showToast('Error updating','error');
  }
  load();
</script>
</body>
</html>
