<!-- ISSUE BOOK PAGE -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue Book — Admin LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar"><div class="topbar-left"><span class="topbar-title">Issue Book</span></div></header>
    <main class="content">
      <div style="max-width:600px">
        <div class="card">
          <div class="card-header">Issue a Book to Student</div>
          <div class="card-body">
            <div class="form-group">
              <label>Select Student</label>
              <select id="f-student"><option value="">-- Select student --</option></select>
            </div>
            <div class="form-group">
              <label>Select Book</label>
              <select id="f-book" onchange="previewBook()"><option value="">-- Select book --</option></select>
              <div id="book-preview" style="display:none;margin-top:12px"></div>
            </div>
            <div class="form-group">
              <label>Loan Duration (days)</label>
              <select id="f-days">
                <option value="7">7 days</option>
                <option value="14" selected>14 days</option>
                <option value="21">21 days</option>
                <option value="30">30 days</option>
              </select>
            </div>
            <button class="btn btn-primary btn-block" onclick="issueBook()">Issue Book</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
  if (!requireAuth('admin')) throw '';
  let BOOKS = [];
  function previewBook() {
    const b = BOOKS.find(x => String(x.id) === document.getElementById('f-book').value);
    const el = document.getElementById('book-preview');
    if (!b) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = `<div class="book-detail" style="gap:16px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px">
      <div class="book-cover" style="width:110px">${bookCover(b)}</div>
      <div><div style="font-weight:700">${esc(b.title)}</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px">by ${esc(b.author)}${b.category ? ' &bull; ' + esc(b.category) : ''}</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5">${esc(b.description) || 'No description available.'}</div>
        <div style="margin-top:8px"><span class="badge badge-success">${b.available}/${b.total_copies} available</span></div></div></div>`;
  }
  async function init() {
    const [sr, br] = await Promise.all([apiFetch('/auth/students'), apiFetch('/books/')]);
    if (sr?.ok) {
      const sel = document.getElementById('f-student');
      sr.data.forEach(s => sel.innerHTML += `<option value="${s.id}">${s.name} (${s.member_id})</option>`);
    }
    if (br?.ok) {
      const sel = document.getElementById('f-book');
      BOOKS = br.data.filter(b => b.available > 0);
      sel.innerHTML = '<option value="">-- Select book --</option>';
      BOOKS.forEach(b => sel.innerHTML += `<option value="${b.id}">${esc(b.title)} — ${esc(b.author)} (${b.available} left)</option>`);
      previewBook();
    }
  }
  async function issueBook() {
    const user_id = document.getElementById('f-student').value;
    const book_id = document.getElementById('f-book').value;
    const days    = document.getElementById('f-days').value;
    if (!user_id || !book_id) { showToast('Select student and book','warning'); return; }
    const r = await apiFetch('/issued/issue', { method:'POST', body:JSON.stringify({user_id,book_id,days}) });
    if (r?.ok) { showToast(`Book issued! Due: ${formatDate(r.data.due_date)}`,'success'); init(); }
    else showToast(r?.data?.error||'Error issuing book','error');
  }
  init();
</script>
</body>
</html>
