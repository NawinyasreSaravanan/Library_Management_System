<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return Book — Admin LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar"><div class="topbar-left"><span class="topbar-title">Return Book</span></div></header>
    <main class="content">
      <div class="card">
        <div class="card-header">Currently Issued Books</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Book</th><th>Student</th><th>Issued</th><th>Due Date</th><th>Pending Fine</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="issued-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
  if (!requireAuth('admin')) throw '';
  async function load() {
    const r = await apiFetch('/issued/who-has-books');
    const tbody = document.getElementById('issued-tbody');
    if (!r?.ok || !r.data.length) { tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">&#10003;</div><p>No books currently issued</p></div></td></tr>'; return; }
    tbody.innerHTML = r.data.map(i => {
      const overdue = new Date(i.due_date) < new Date();
      const overdueDays = overdue ? Math.floor((new Date() - new Date(i.due_date)) / 86400000) : 0;
      const pendingFine = overdueDays * 10;
      return `<tr>
        <td>${bookCell(i)}</td>
        <td>${i.student_name}<br><small style="color:#94a3b8">${i.member_id}</small></td>
        <td>${formatDate(i.issued_date)}</td>
        <td style="color:${overdue?'#ef4444':''}">${formatDate(i.due_date)}</td>
        <td style="color:${overdue?'#ef4444':'#10b981'};font-weight:600">${overdue ? 'Rs.' + pendingFine.toFixed(2) : '—'}</td>
        <td><span class="badge badge-${overdue?'danger':'warning'}">${overdue?'Overdue':'Issued'}</span></td>
        <td><button class="btn btn-success btn-sm" onclick="returnBook(${i.id},${esc(JSON.stringify(i.title))})">Return</button></td>
      </tr>`;
    }).join('');
  }
  async function returnBook(id, title) {
    if (!confirm(`Return "${title}"?`)) return;
    const r = await apiFetch(`/issued/return/${id}`, { method:'POST' });
    if (r?.ok) {
      const msg = r.data.fine > 0 ? `Returned. Fine: Rs.${r.data.fine}` : 'Book returned successfully!';
      showToast(msg, r.data.fine > 0 ? 'warning' : 'success');
      load();
    } else showToast(r?.data?.error||'Error','error');
  }
  load();
</script>
</body>
</html>
